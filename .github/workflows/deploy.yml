name: Deploy to Google Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy mihna-agent \
          --source . \
          --platform managed \
          --region asia-south1 \
          --allow-unauthenticated \
          --port 8501 \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300s \
          --add-cloudsql-instances "${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
          --set-env-vars "DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }},CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
          --project project-d699d925-921c-4e54-8c4 \
          --quiet
