name: Python Application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libglib2.0-dev pkg-config libcairo2-dev libgirepository1.0-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Remove OS-bound & conflicting pinned rules dynamically
        sed -i '/^python-apt/Id' requirements.txt || true
        sed -i '/^dbus-python/Id' requirements.txt || true
        sed -i 's/Django==.*/Django>=5.0.0/g' requirements.txt || true
        sed -i 's/protobuf==.*/protobuf>=5.29.3/g' requirements.txt || true
        sed -i 's/tensorflow==.*/tensorflow>=2.15.0/g' requirements.txt || true
        pip install -r requirements.txt
